<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amara</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">✏️</span>Amara</div>
    <div class="top-right">
      <button id="homeOpen" type="button" class="credits-open" hidden>Home</button>
      <button id="creditsOpen" type="button" class="credits-open">Credits</button>
      <div id="net" class="pill pill-wait" role="status">Checking network…</div>
    </div>
  </header>

  <section id="welcome" class="welcome">
    <h1 id="welcomeTitle">What do you want to learn today?</h1>
    <div id="chips" class="chips">
      <button type="button" class="chip">How does a volcano erupt?</button>
      <button type="button" class="chip">How do I add fractions?</button>
      <button type="button" class="chip">How do plants make their food?</button>
      <button type="button" class="chip">¿Cómo funcionan los imanes?</button>
    </div>
    <div class="subjects-box">
      <h2 id="subjectsTitle" class="subjects-title">Explore by subject</h2>
      <div id="subjects" class="subjects"></div>
    </div>
  </section>

  <section id="browse" class="browse" hidden>
    <div class="browse-top">
      <button id="browseBack" type="button" class="back">←</button>
      <h1 id="browseTitle"></h1>
      <div id="grades" class="grades" role="group"></div>
    </div>
    <div id="topics" class="topics"></div>
  </section>

  <section id="lesson" class="lesson" hidden>
    <h2 id="asked" class="asked"></h2>
    <div id="answer" class="answer" aria-live="polite"></div>
    <footer class="meta">
      <div id="sources" class="sources"></div>
      <div id="speed" class="speed"></div>
    </footer>
  </section>

  <dialog id="credits" class="credits" aria-labelledby="creditsTitle">
    <h2 id="creditsTitle">Amara</h2>
    <p id="creditsAuthor"></p>
    <p id="creditsTech"></p>
    <p id="creditsLibrary"></p>
    <p id="creditsIndependent"></p>
    <p id="creditsConnect"></p>
    <p class="credits-links">
      <a href="https://www.linkedin.com/in/alexinteractive" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://amaratutor.org" target="_blank" rel="noopener">amaratutor.org</a>
      <a id="creditsFeedback" target="_blank" rel="noopener"></a>
    </p>
    <form method="dialog"><button id="creditsClose" class="credits-close"></button></form>
  </dialog>

  <form id="form" class="ask" autocomplete="off">
    <input id="question" type="text" maxlength="500" placeholder="Type your question…" aria-label="Your question" autofocus>
    <button id="send" type="submit">Ask</button>
  </form>
  <p id="credit" class="credit">
      <span id="creditText"></span>
      <a href="https://www.linkedin.com/in/alexinteractive" target="_blank" rel="noopener">LinkedIn</a> ·
      <a href="https://amaratutor.org" target="_blank" rel="noopener">amaratutor.org</a> ·
      <a id="creditFeedback" target="_blank" rel="noopener"></a>
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
